<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow Neo</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Background -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="content-wrapper">

        <!-- Header -->
        <header>
            <h1><i class="fas fa-bolt"></i> TaskFlow Neo</h1>
            <p>Focus. Track. Win.</p>

            <div class="stats">
                <div class="stat">
                    <span id="total">0</span>
                    <small>Total</small>
                </div>
                <div class="stat">
                    <span id="active">0</span>
                    <small>Active</small>
                </div>
                <div class="stat">
                    <span id="done">0</span>
                    <small>Done</small>
                </div>
            </div>
        </header>

        <!-- Input -->
        <div class="input-box">
            <input id="taskInput" placeholder="What needs to be done...">
            <button onclick="addTask()">Add</button>
        </div>

        <!-- Filters -->
        <div class="filters">
            <button onclick="filter Tasks('all')" class="active">All</button>
            <button onclick="filterTasks('active')">Active</button>
            <button onclick="filterTasks('completed')">Done</button>
            <button onclick="clearCompleted()">Clear</button>
        </div>

        <!-- Tasks -->
        <div id="taskList"></div>

        <!-- Progress -->
        <div class="progress-box">
            <div class="progress-text">
                <span>Progress</span>
                <span id="percent">0%</span>
            </div>
            <div class="bar">
                <div id="fill"></div>
            </div>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
